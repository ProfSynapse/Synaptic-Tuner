# Environment execution rules for runtime-backed validation.
#
# This file controls how tool calls are interpreted inside environment runtimes.
# Keep this config-driven and extend here instead of hardcoding logic in Python.
#
# - strict_schema: fail execution when tool name is not defined in tool_schema.yaml
# - default_action: fallback behavior when no rule matches (simulate | read | write ...)
# - key_hints: argument-key aliases for path/query/content extraction
# - verb_rules: map tool-name verb patterns -> primitive runtime actions
# - tool_action_hints: explicit per-tool overrides when inference is ambiguous

environment_execution:
  strict_schema: false
  default_action: simulate

  # Optional raw CLI rejection rules applied before any executor normalization.
  # Keep these generic and config-driven so scenarios can opt into stricter or
  # looser command surfaces without changing runtime code.
  invalid_cli_patterns:
    - name: non_ascii_whitespace
      pattern: "[\\u00A0\\u1680\\u2000-\\u200A\\u202F\\u205F\\u3000]"
      message: "CLI command contains non-ASCII whitespace; use ordinary spaces."
    - name: markdown_backticks
      pattern: "`"
      message: "CLI command contains markdown backticks; use raw paths or quoted arguments instead."

  key_hints:
    source_path:
      - path
      - filePath
      - sourcePath
      - targetPath
      - notePath
    destination_path:
      - newPath
      - destinationPath
      - destPath
      - to
      - outputPath
    content:
      - content
      - text
      - body
      - value
    old_content:
      - oldContent
      - old_content
      - old
      - oldText
      - old_text
    new_content:
      - newContent
      - new_content
      - new
      - replacement
      - newText
      - new_text
    query:
      - query
      - search
      - term
      - text

  verb_rules:
    mkdir:
      - createfolder
      - mkdir
      - makefolder
      - create_dir
    append:
      - append
    write:
      - write
      - update
      - createcontent
    replace:
      - replace
    read:
      - read
      - open
      - get
    list:
      - list
      - ls
    move:
      - move
      - rename
      - edit
    copy:
      - copy
      - duplicate
    delete:
      - delete
      - remove
      - archive
    search:
      - search
      - find

  # Optional explicit overrides:
  # tool_action_hints:
  #   yourAgent_readFile: read
  #   yourAgent_writeFile: write
  #   yourAgent_moveFile: move
  #   yourAgent_searchFiles: search
  #   yourAgent_nonFilesystemAction: simulate
  tool_action_hints: {}
