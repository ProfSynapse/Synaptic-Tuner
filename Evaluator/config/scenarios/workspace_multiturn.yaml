      - report
    system_context:
      session_id: session_1732300800000_workspace005
      selected_workspace:
        recent_files:
          - Projects/Atlas/Release/README.md
          - Projects/Atlas/Release/customer-facing-notes.md
        key_files:
          - Projects/Atlas/Release/customer-facing-notes.md
    environment:
      fixture:
        notes:
          - path: Projects/Atlas/Release/README.md
            frontmatter:
              title: Atlas Release
              type: index
            body: |
              Release notes and launch readiness live in this folder.
          - path: Projects/Atlas/Release/customer-facing-notes.md
            frontmatter:
              title: Customer Facing Release Notes
              type: release-note
              owner: Priya
              status: ready
            body: |
              Owner customer-facing release notes.
              Owner: Priya
              Readiness: ready for customer distribution.
              Last reviewed: 2026-04-25
          - path: Projects/Phoenix/Release/customer-facing-notes.md
            frontmatter:
              title: Phoenix Customer Facing Release Notes
              type: release-note
              owner: Devon
              status: draft
            body: |
              Phoenix release notes are not part of this request.
      assertions:
        - type: path_exists
          path: Projects/Atlas/Release/customer-facing-notes.md
        - type: path_exists
          path: Projects/Phoenix/Release/customer-facing-notes.md
      loop:
        stop_on_environment_pass: false
        require_final_text_after_pass: false
    correct:
      all:
        - type: text_regex
          pattern: (?is)Priya
        - type: text_regex
          pattern: (?is)ready for customer distribution|status:\s*ready|ready
        - type: length_max
          path: $.tool_calls
          value: 0
    scoring:
      paths:
        - name: list-release-then-read-report
          tier: preferred
          score: 1.0
          ordered_tools:
            - storage list
            - content read
          require_environment_pass: true
        - name: search-read-report
          tier: acceptable
          score: 0.8
          ordered_tools:
            - search directory
            - content read
          require_environment_pass: true

  - id: workspace_state_find_read_update_launch_index
    question: Pick this back up from where we left off. Find the launch checklist item that says customer comms are approved, then update the Atlas launch index with the final go/no-go line and a link to that checklist. Do not touch Phoenix.
    tags:
      - workspace
      - multiturn
      - search
      - read
      - act
      - workspace_state
    system_context:
      session_id: session_1732300800000_workspace001
      selected_workspace:
        recent_files:
          - Projects/Atlas/Launch/index.md
          - Projects/Atlas/Launch/checklists/customer-comms.md
        key_files:
          - Projects/Atlas/Launch/index.md
        sessions:
          - id: session_launch_readiness
            summary: User asked which launch checklist still had open approval items; customer communications was the item to verify next.
      extra_sections:
        - tag: prior_conversation
          content: |
            User: Which launch checklist still needs review?
            Assistant: I found several launch checklist files. The next likely candidate is the customer communications checklist, but I need to read it before updating the launch index.
    environment:
      fixture:
        notes:
          - path: Projects/Atlas/Launch/index.md
            frontmatter:
              title: Atlas Launch Index
              type: index
              status: active
            body: |
              # Atlas Launch

              ## Status
              - Readiness review pending.
          - path: Projects/Atlas/Launch/checklists/customer-comms.md
            frontmatter:
              title: Customer Comms Checklist
              type: checklist
              status: approved
            body: |
              - Owner: comms
              - Customer comms are approved for launch.
              - Customer comms approved for launch.
              - Final go/no-go: go
          - path: Projects/Phoenix/Launch/index.md
            frontmatter:
              title: Phoenix Launch Index
              type: index
              status: active
            body: |
              # Phoenix Launch

              - Phoenix workspace should not be edited.
      assertions:
        - type: file_contains
          path: Projects/Atlas/Launch/index.md
          text: "Final go/no-go: go"
        - type: file_contains
          path: Projects/Atlas/Launch/index.md
          text: "[[Projects/Atlas/Launch/checklists/customer-comms]]"
        - type: file_contains
          path: Projects/Phoenix/Launch/index.md
          text: "Phoenix workspace should not be edited."
    correct:
      all:
        - type: text_regex
          pattern: (?s)\S
        - type: length_max
          path: $.tool_calls
          value: 0
    scoring:
      paths:
        - name: search-read-update-index
          tier: preferred
          score: 1.0
          ordered_tools:
            - search content
            - content read
            - content write
          require_environment_pass: true
        - name: list-read-update-index
          tier: acceptable
          score: 0.8
          ordered_tools:
            - storage list
            - content read
            - content write
          require_environment_pass: true
        - name: direct-update-index
          tier: partial
          score: 0.45
          all_tools:
            - content write
          require_environment_pass: true

  - id: workspace_state_continue_prior_search_archive_superseded_rfc
    question: Yes, archive the stale one from that search, but only after checking which RFC is marked superseded. Leave active RFCs and Phoenix files alone.
    tags:
      - workspace
      - multiturn
      - list
      - read
      - act
      - workspace_state
      - destructive
    system_context:
      session_id: session_1732300800000_workspace002
      selected_workspace:
        recent_files:
          - Projects/Atlas/RFC/RFC-014-cache-policy.md
          - Projects/Atlas/RFC/RFC-009-cache-policy-old.md
        key_files:
          - Projects/Atlas/RFC/RFC-014-cache-policy.md
      extra_sections:
        - tag: prior_conversation
          content: |
            User: Search Atlas RFCs for cache policy.
            Assistant: I found two Atlas candidates: Projects/Atlas/RFC/RFC-014-cache-policy.md and Projects/Atlas/RFC/RFC-009-cache-policy-old.md. One may be stale, but I have not read them yet.
    environment:
      fixture:
        notes:
          - path: Projects/Atlas/RFC/RFC-014-cache-policy.md
            frontmatter:
              title: RFC 014 Cache Policy
              type: rfc
              status: active
            body: |
              Current cache policy for Atlas.
          - path: Projects/Atlas/RFC/RFC-009-cache-policy-old.md
            frontmatter:
              title: RFC 009 Cache Policy Old
              type: rfc
              status: superseded
            body: |
              Superseded by RFC-014-cache-policy.
          - path: Projects/Phoenix/RFC/RFC-009-cache-policy-old.md
            frontmatter:
              title: Phoenix RFC 009 Cache Policy Old
              type: rfc
              status: superseded
            body: |
              Phoenix file with the same stale-looking name.
      assertions:
        - type: path_not_exists
          path: Projects/Atlas/RFC/RFC-009-cache-policy-old.md
        - type: path_exists
          path: Projects/Atlas/RFC/RFC-014-cache-policy.md
        - type: path_exists
          path: Projects/Phoenix/RFC/RFC-009-cache-policy-old.md
    correct:
      all:
        - type: text_regex
          pattern: (?s)\S
        - type: length_max
          path: $.tool_calls
          value: 0
    scoring:
      paths:
        - name: read-candidates-then-archive
          tier: preferred
          score: 1.0
          ordered_tools:
            - content read
            - storage archive
          min_tool_calls: 3
          require_environment_pass: true
        - name: list-read-archive
          tier: acceptable
          score: 0.85
          ordered_tools:
            - storage list
            - content read
            - storage archive
          require_environment_pass: true
        - name: search-archive
          tier: partial
          score: 0.55
          ordered_tools:
            - search directory
            - storage archive
          require_environment_pass: true

