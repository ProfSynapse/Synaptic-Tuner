name: Workspace Multi-Turn Tool Evals
description: Environment-backed multi-turn workspace tasks focused on search, list, read, and acting on discovered state.
defaults:
  system_template: environmental_workspace_vault
  system_context:
    workspace_id: ws_1732300800000_atlasops
    available_workspaces:
      - id: ws_1732300800000_atlasops
        name: Atlas Ops
        description: Launch operations, customer notes, and incident follow-up
        root_folder: Projects/Atlas/
      - id: ws_1732300800001_phoenix
        name: Phoenix Migration
        description: Phoenix migration planning and risk tracking
        root_folder: Projects/Phoenix/
    available_prompts:
      - id: agent_1732300800000_workspace_researcher
        name: Workspace Researcher
        purpose: Finds relevant files before taking action
      - id: agent_1732300800001_note_operator
        name: Note Operator
        purpose: Updates and moves vault notes after verification
    selected_workspace:
      id: ws_1732300800000_atlasops
      name: Atlas Ops
      root_folder: Projects/Atlas/
      preferences: Read before changing existing notes. Prefer workspace-local paths unless the user names another workspace.
      workflows:
        - name: Search Then Act
          steps:
            - Search or list candidate files
            - Read the relevant note before editing or moving it
            - Apply the smallest workspace-local change
            - Leave unrelated workspace files unchanged
      sessions:
        - id: session_prev_workspace_research
          summary: The user often resumes from prior search results and expects workspace state to carry forward.
    assistant_instructions: You are an AI assistant helping manage an Obsidian-style workspace. Use your available workspace tools when you need to inspect or change files. Do not infer file contents from names alone.
  environment:
    allowed_tools:
      - storage create-folder
      - storage list
      - storage move
      - storage archive
      - content read
      - content write
      - content replace
      - search content
      - search directory
    max_steps: 10
    execution:
      strict_schema: true
    loop:
      enabled: true
      mode: agentic
      max_turns: 10
      max_tool_steps: 10
      continue_on_execution_error: true
      stop_on_text_response: true
      stop_on_environment_pass: true
      require_final_text_after_pass: true
      final_text_prompt: Reply to the user with a brief final text-only response summarizing what changed.
      tool_result_format: json

tests:
  - id: workspace_search_read_report_oauth_callback_loop
    question: Can you tell me what happened with the OAuth callback loop in Atlas? I need the incident, root cause, and next action, but do not create or edit anything.
    tags:
      - workspace
      - multiturn
      - search
      - read
      - report
    system_context:
      session_id: session_1732300800000_workspace000
      selected_workspace:
        recent_files:
          - Projects/Atlas/Support/tickets.md
          - Projects/Atlas/Incidents/auth-callback-loop.md
        key_files:
          - Projects/Atlas/Incidents/auth-callback-loop.md
    environment:
      fixture:
        notes:
          - path: Projects/Atlas/Support/tickets.md
            frontmatter:
              title: Support Tickets
              type: support-log
              status: active
            body: |
              Login issue tickets are tracked here. No root cause is recorded in this rollup.
          - path: Projects/Atlas/Incidents/auth-callback-loop.md
            frontmatter:
              title: Auth Callback Loop
              type: incident
              severity: high
            body: |
              OAuth callback loop incident.
              Incident: OAuth callback loop caused repeated redirects for Acme admins.
              Root cause: redirect URI mismatch after the staging callback was promoted.
              Next action: rotate stale callback allowlist and confirm production redirect URI ownership.
          - path: Projects/Phoenix/Incidents/oauth-callback-loop.md
            frontmatter:
              title: Phoenix OAuth Callback Loop
              type: incident
              severity: low
            body: |
              Phoenix incident belongs to another workspace.
      assertions:
        - type: path_exists
          path: Projects/Atlas/Incidents/auth-callback-loop.md
        - type: path_exists
          path: Projects/Phoenix/Incidents/oauth-callback-loop.md
        - type: path_not_exists
          path: Projects/Atlas/Briefs/oauth-callback-brief.md
      loop:
        stop_on_environment_pass: false
        require_final_text_after_pass: false
    correct:
      all:
        - type: text_regex
          pattern: (?is)OAuth callback loop
        - type: text_regex
          pattern: (?is)redirect URI mismatch
        - type: text_regex
          pattern: (?is)rotate stale callback allowlist
        - type: length_max
          path: $.tool_calls
          value: 0
    scoring:
      paths:
        - name: search-read-report
          tier: preferred
          score: 1.0
          ordered_tools:
            - search content
            - content read
          require_environment_pass: true
        - name: list-read-report
          tier: acceptable
          score: 0.8
          ordered_tools:
            - storage list
            - content read
          require_environment_pass: true

  - id: workspace_list_read_report_release_notes_owner
