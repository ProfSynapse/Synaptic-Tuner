[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synaptic-tuner"
dynamic = ["version"]
description = "Agentic-first toolkit for synthetic data, model training, evaluation, and deployment"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Synaptic Labs" }]
dependencies = [
  "PyYAML>=6,<7",
  "jsonschema>=4.18,<5",
  "packaging>=23,<26",
  "python-dotenv>=1,<2",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
modal = ["modal==1.5.4"]

[project.scripts]
synaptic = "tuner.cli.main:main"

# Third-party distributions declare logical bindings in authoritative,
# versioned groups such as `synaptic_tuner.plugins.renderer.v1`. Synaptic Tuner
# itself intentionally ships no default project plug-ins.

[tool.setuptools.dynamic]
version = { attr = "synaptic_tuner._version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = [
  "tuner*",
  "synaptic_tuner*",
  "shared*",
  "SynthChat*",
  "Evaluator*",
  "MechInterp*",
  "Trainers*",
]
namespaces = true

[tool.setuptools.package-data]
"tuner.execution.providers.modal" = ["modal-runtime-v1.lock.json"]
"tuner.runtime" = ["manifests/offline-sft-worker-v1.json"]

# The Modal runtime lock is part of the importable engine contract. Broader
# runtime scripts, schemas, templates, containers, and configuration assets are
# still source-tree assets pending the full publication inventory.
