name: gguf-conversion
description: Convert a merged HuggingFace model to one or more GGUF types (optionally imatrix-calibrated) and upload them with gguf_manifest.json. CPU only.
target: cloud
method: gguf
provider: hf_jobs

job:
  image: "unsloth/unsloth:2026.1.2-pt2.9.0-cu12.8-update@sha256:5266c57be21059bfb407d80dc2f448868a5c2e2dbe7b2aa27780f48b48cbec39"
  flavor: "cpu-upgrade"
  namespace: "professorsynapse"
  timeout_hours: 4
  labels:
    task: gguf-conversion

repo:
  checkout: true
  clone_dir: "/workspace/repo"

setup:
  use_project_deps: true

run:
  include_hf_token: true
  env:
    PYTHONPATH: "{repo_dir}"
    GGUF_MODEL_REPO: "professorsynapse/gemma-4-e4b-sft"
    # Space- or comma-separated. f32/f16/bf16/q8_0/tq1_0/tq2_0 convert directly
    # (no compile); anything else (q4_k_m, q5_k_m, IQ types) builds llama-quantize.
    GGUF_QUANT_TYPE: "q8_0"
    # Optional importance-matrix calibration: HF dataset repo + JSONL path inside it
    # (e.g. the SFT training data). Leave both empty to skip. Required for IQ types.
    GGUF_CALIBRATION_REPO: ""
    GGUF_CALIBRATION_FILE: ""
  steps:
    # {{ }} escapes the template renderer; the shell sees ${VAR:+...} and omits
    # the calibration flags when GGUF_CALIBRATION_REPO is empty.
    - "cd {repo_dir} && python scripts/cloud_gguf_convert.py --model-repo \"$GGUF_MODEL_REPO\" --quant $GGUF_QUANT_TYPE ${{GGUF_CALIBRATION_REPO:+--calibration-repo \"$GGUF_CALIBRATION_REPO\" --calibration-file \"$GGUF_CALIBRATION_FILE\"}}"
