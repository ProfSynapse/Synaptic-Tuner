# Trainers/decision/configs/model_registry.yaml
#
# Location: Trainers/decision/configs/model_registry.yaml
# Purpose:  Single source of truth for every torso the decision trainer can
#           load. Each entry fully describes how to LOAD and ADAPT one base
#           model. Adding a model is one block here -- no Python change.
# Used by:  Trainers/decision/decision_core/registry.py, which the trainer
#           resolves `model.registry_name` against. The resolved values are
#           written into final_model/decision_config.json, so a trained
#           checkpoint loads without this file.
#
# Fields:
#   hf_id                Hugging Face repo id.
#   revision             Pinned commit sha. Pin before any comparison run.
#   loader               causal_lm   -> AutoModelForCausalLM
#                        text_tower  -> transformers.<causal_lm_class> with the
#                                       checkpoint's text config (multimodal
#                                       wrappers such as Qwen3.5)
#   causal_lm_class      transformers class name; required for text_tower.
#   torch_dtype          bfloat16 | float16 | float32
#   max_length           Default token window (training drops longer rows).
#   attn_implementation  null = transformers default.
#   lora_target_modules  Module names LoRA attaches to. Qwen3.5 needs its Gated
#                        DeltaNet projections too, or LoRA reaches only the
#                        full-attention layers (6 of 24 on the 2B).
#   notes                Free text; shown by --dry-run.
#
# Revisions were read from the Hub API on 2026-10-04.

models:
  qwen35-0.8b-base:
    hf_id: Qwen/Qwen3.5-0.8B-Base
    revision: dc7cdfe2ee4154fa7e30f5b51ca41bfa40174e68
    loader: text_tower
    causal_lm_class: Qwen3_5ForCausalLM
    torch_dtype: bfloat16
    max_length: 4096
    attn_implementation: null
    lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj,
                          in_proj_qkv, in_proj_z, in_proj_a, in_proj_b, out_proj]
    notes: Smallest Qwen3.5 torso; fastest iteration, weakest reasoning.

