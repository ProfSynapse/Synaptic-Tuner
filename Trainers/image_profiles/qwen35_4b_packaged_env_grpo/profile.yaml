schema_version: synaptic-derived-training-image-profile/v1
name: qwen35-4b-packaged-env-grpo
platform: linux/amd64

# Environment-backed GRPO on the same immutable Unsloth base as packaged SFT
# (runtime profile qwen35-env-grpo-v1). The ML stack change is carried by
# hash-pinned bootstrap wheels, installed offline with --no-deps
# --require-hashes like the rest of the packaged runtime:
#   trl 0.24.0 -> 1.13.0          (env_mask support; rollout_func on the
#                                  transformers path; needs datasets>=4.7)
#   datasets 4.3.0 -> 4.8.5
#   unsloth 2026.9.7 -> 2026.10.2 (not imported on the env-GRPO path; kept so
#   unsloth_zoo 2026.9.6 -> 2026.10.2  the declared caps cover trl<=1.13.0,
#                                  transformers<=5.17.0 and datasets<5)
# transformers 5.17.0, peft 0.21.0, accelerate 1.15.0 and torch 2.11.0+cu128
# stay as measured in the base. vLLM 0.26.0 stays installed and unused
# (use_vllm: false).
#
# The base has four pre-existing `pip check` findings (mistral-common numpy,
# vllm numba, vllm torchcodec, decord platform). Installing this bootstrap
# closure was measured to leave that output byte-identical, so the generic
# before/after gate holds. Every bootstrap requirement is satisfied by the
# closure or the base; datasets' fsspec[http] is satisfied by the base's
# fsspec 2025.9.0 and aiohttp. Inventory: qwen35-env-grpo-v1.inventory.json,
# captured with scripts/capture_runtime_profile_inventory.py.
#
# The synaptic-tuner wheel pin is the same as the packaged SFT profiles; a
# Modal build replaces it with the wheel built from the accepted source commit.
