# SynthChat Configuration
# Main settings for dataset generation and improvement

llm:
  # Generation (local is fine - just creating raw examples)
  # Options: lmstudio, ollama, openrouter, unsloth
  generation:
    provider: openrouter
    model: xiaomi/mimo-v2.5
    provider_routing:
      require_parameters: false
    plugins:
      - id: response-healing
    fallback_models:
      - provider: openrouter
        model: openai/gpt-5.4-nano
    temperature: 0.7
    max_tokens: 4096  # Increased for content writing scenarios
  # Commented out for testing - restore when LM Studio running
  # generation:
  #   provider: lmstudio
  #   model: local-model
  #   host: localhost
  #   port: 1234
  #   temperature: 0.7
  #   max_tokens: 4096

  # Example: Use Unsloth with a LoRA adapter for generation
  # generation:
  #   provider: unsloth
  #   model: /path/to/lora_adapter  # Directory with adapter_config.json
  #   max_seq_length: 4096
  #   load_in_4bit: true
  #   top_p: 0.9
  #   temperature: 0.7
  #   max_tokens: 2048

  # Improvement (cloud recommended - needs strong judge)
  improvement:
    provider: openrouter
    model: openai/gpt-oss-120b
    provider_routing:
      require_parameters: false
    plugins:
      - id: response-healing
    fallback_models:
      - provider: openrouter
        model: openai/gpt-5.4-nano
    temperature: 0.1  # Deterministic judging
    max_tokens: 2048

improvement:
  max_iterations: 10
  on_max_iterations: skip  # skip | fail | save_partial
  default_rubrics:
    - system_prompt_format
    - thinking_quality
    - tool_alignment
    - response_quality

output:
  default_dir: Datasets/synthchat/
  include_metadata: true
  versioning: datetime  # Append datetime to output files

# Resilience and checkpointing
resilience:
  checkpoint_every: 10  # Save progress every N examples
  retry_attempts: 3
  retry_delay: 5  # seconds
  checkpoint_file: .synthchat_checkpoint.json

# Logging configuration
logging:
  save_interactions: true
  interactions_dir: SynthChat/interactions/
  save_failures: true  # Keep failed examples for KTO negative samples
  log_level: INFO

# Generation settings
generation:
  random_seed: null  # Set for reproducibility, null for random
  stage_validation: true  # Validate each stage before proceeding

# Optional privacy preprocessing for seed data and dataset sanitization.
# When enabled with a profile, raw seed text is sanitized before generation.
privacy_preprocess:
  enabled: false
  profile: null
  apply_to:
    docs: true
    input_jsonl: false
    generated_output: false
  on_error: fail   # fail | skip | keep_masked

# Optional environment-backed tool execution checks.
# This runs generated tool calls against an isolated runtime and stores traces
# in example metadata to support downstream filtering/evaluation.
environment:
  enabled: false
  backend: local   # local | e2b
  template: null   # E2B template id (only used when backend=e2b)
  timeout_seconds: 120.0
  tool_schema_path: null       # Optional custom tool schema YAML path
  execution_config_path: null  # Optional custom environment execution config path

# Cost tracking (OpenRouter)
cost_tracking:
  enabled: true
  include_usage: true

# Default targets for "Generate new dataset"
# User can accept these or customize
defaults:
  targets:
    # Tool scenarios
    storage create-folder: 50
    storage archive: 30
    storage move: 30
    storage list: 40
    content write: 40
    content replace: 20
    content set-property: 10
    prompt execute: 25

    # Content writing scenarios (longer form content with frontmatter)
    content_write_research: 50
    content_write_blog: 50
    content_write_creative: 40
    content_write_documentation: 50
    content_write_journal: 40

    # Behavioral scenarios
    intellectual_humility: 25
    verification_before_action: 25
    error_recovery: 20
    context_continuity: 20
    strategic_tool_selection: 20
