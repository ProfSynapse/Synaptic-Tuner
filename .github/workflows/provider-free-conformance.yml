name: Provider-free coordinator conformance

on:
  pull_request:
    paths:
      - "synaptic_tuner/api/v1/**"
      - "tuner/execution/coordinator_v1/**"
      - "tuner/execution/foundation_v2/**"
      - "tuner/execution/fake_provider_v1.py"
      - "tuner/execution/providers/modal/**"
      - "tuner/execution/providers/hf_jobs_provider_v1/**"
      - "tests/execution/providers/test_hf_jobs_public_family.py"
      - "tests/execution/providers/test_hf_pinned_model_snapshot.py"
      - "Trainers/runtime_profiles/**"
      - "Trainers/image_profiles/qwen35_4b_conversation_sft_candidate_v1/**"
      - "tests/contract/test_data_conversation_sft_handoff_v1.py"
      - "tests/contract/test_environment_admission_v1.py"
      - "tests/contract/test_environment_sessions_v1.py"
      - "tests/contract/test_public_training_input_v1.py"
      - "tuner/training/**"
      - "tuner/dataset_prep/**"
      - "tests/dataset_prep/**"
      - "tuner/project/**"
      - "tuner/runtime/**"
      - "tuner/inference/**"
      - "tests/inference/**"
      - "Evaluator/vllm_setup.py"
      - "Evaluator/interactive_cli.py"
      - "Evaluator/cloud_hf_job_vllm.py"
      - "Evaluator/cli.py"
      - "Evaluator/base_client.py"
      - "Evaluator/openai_compat_client.py"
      - "Evaluator/verified_vllm_chat.py"
      - "Evaluator/local_run_chat.py"
      - "tests/evaluator/test_same_job_post_training_eval.py"
      - "tests/evaluator/test_owned_process.py"
      - "tests/evaluator/test_vllm_*.py"
      - "tests/evaluator/test_chat_session.py"
      - "tests/evaluator/test_verified_vllm_chat.py"
      - "tests/evaluator/test_local_run_chat.py"
      - "tests/evaluator/test_run_chat_local_integration.py"
      - "tests/evaluator/test_http_transport_policy.py"
      - "tests/evaluator/test_http_request_bounds.py"
      - "tests/test_evaluator_clients.py"
      - "tests/cloud/test_vllm_setup.py"
      - "tests/cloud/test_cloud_hf_job_vllm.py"
      - "tests/contract/test_modal_optional_dependency.py"
      - "tests/contract/test_modal_runtime_lock*.py"
      - "tests/contract/test_modal_bootstrap_closure.py"
      - "tests/contract/test_offline_sft_worker_closure.py"
      - "tests/contract/fixtures/api_v1_formal_exports_coordinator.json"
      - "tests/contract/test_public_runs_api_v1.py"
      - "tests/contract/test_public_training_api_v1.py"
      - "tests/contract/test_reference_data_v1.py"
      - "tests/contract/test_dataset_validation_bounds_v1.py"
      - "tests/contract/test_public_publication_v1.py"
      - "tests/contract/test_provider_neutral_foundation_v1.py"
      - "tests/conftest.py"
      - "tests/training/**"
      - "tests/runtime/**"
      - "tests/trainers/sft/test_runtime_v1.py"
      - "tests/execution/providers/docker_provider_v1/**"
      - "tuner/execution/providers/docker_provider_v1/**"
      - "tests/execution/coordinator_v1/**"
      - "tests/execution/foundation_v2/**"
      - "tests/execution/providers/test_modal_*.py"
      - "tests/execution/providers/modal_coordinator_fixtures.py"
      - "tests/execution/test_mutation_broker.py"
      - "tuner/execution/broker.py"
      - "tests/execution/test_fake_provider_v1_conformance.py"
      - "examples/host-project/providers/modal-a10-v1.yaml"
      - "requirements/modal-launcher-v1.lock"
      - "tuner/runtime/manifests/offline-sft-worker-v1.json"
      - "Trainers/sft/**"
      - "Trainers/grpo/**"
      - "tests/trainers/grpo/**"
      - "Trainers/shared/**"
      - "shared/**"
      - "tuner/cloud/**"
      - "tuner/execution/*.py"
      - "tuner/__init__.py"
      - "synaptic_tuner/__init__.py"
      - "synaptic_tuner/_version.py"
      - "synaptic_tuner/api/__init__.py"
      - "schemas/**"
      - "scripts/regenerate_modal_runtime_lock.py"
      - "scripts/regenerate_offline_sft_worker_closure.py"
      - "scripts/regenerate_grpo_worker_closures.py"
      - "scripts/regenerate_hf_parent_closure.py"
      - "scripts/capture_modal_inference_runtime.py"
      - "scripts/inspect_modal_inference_runtime.py"
      - "scripts/ci_pytest_shard.sh"
      - ".gitattributes"
      - "pyproject.toml"
      - ".github/workflows/provider-free-conformance.yml"
  push:
    branches: [main, feat/submodule-cloud-api-v1, feat/submodule-cloud-api-v1-windows]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provider-free-conformance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: CPython 3.12 / pytest 8 (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite: [core, modal-inference-a-l, modal-inference-m-z]
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      MODAL_IS_REMOTE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Set up supported Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the minimal conformance environment
        run: |
          python -m pip install \
            'pytest>=8,<9' \
            'numpy>=1.24,<3' \
            'pandas>=2,<3' \
            'setuptools>=68' \
            'requests>=2.32,<3' \
            wheel
          python -m pip wheel --no-deps --no-build-isolation \
            --wheel-dir "$RUNNER_TEMP/wheelhouse" .
          python -m pip install "$RUNNER_TEMP"/wheelhouse/synaptic_tuner-*.whl

      - name: Verify exact schema inventory through source archive and wheel builds
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import setuptools.build_meta
          directory = Path(os.environ["RUNNER_TEMP"]) / "sdist"
          directory.mkdir()
          setuptools.build_meta.build_sdist(str(directory))
          PY
          python -m pip wheel --no-deps --no-build-isolation \
            --wheel-dir "$RUNNER_TEMP/sdist-wheelhouse" "$RUNNER_TEMP"/sdist/*.tar.gz
          python - <<'PY'
          import os
          from pathlib import Path
          import zipfile
          import runpy
          root = Path(os.environ["RUNNER_TEMP"])
          expected = {"schemas/" + path.name: path.read_bytes()
                      for path in Path("schemas").glob("synaptic-*.schema.json")}
          assert expected
          contract = runpy.run_path("tests/contract/test_runtime_assets.py")
          workflow_families = tuple(family for family in contract["PACKAGE_RESOURCE_FAMILIES"]
              if family.name in {"evaluator configuration and recipes", "SynthChat core configuration",
                                "SynthChat rubric and scenario catalogs",
                                "GRPO reward and environment configuration", "tool schema catalogs"})
          workflow = {}
          for member in contract["_expanded_assets"](workflow_families):
              target = "synaptic_tuner/runtime/" + member if member in {
                  "cli-first-tool-schemas.json", "Tools/tool_schemas.json"} else member
              workflow[target] = Path(member).read_bytes()
          for directory in ("wheelhouse", "sdist-wheelhouse"):
              wheels = list((root / directory).glob("synaptic_tuner-*.whl"))
              assert len(wheels) == 1
              os.environ[contract["WHEEL_ENV"]] = str(wheels[0])
              contract["test_installed_workflow_configuration_assets_are_exact"]()
              with zipfile.ZipFile(wheels[0]) as archive:
                  actual = {name: archive.read(name) for name in archive.namelist()
                            if name.startswith("schemas/")}
                  assert actual == expected
                  assert {name: archive.read(name) for name in workflow} == workflow
                  assert {name for name in archive.namelist()
                          if name.startswith("synaptic_tuner/runtime/")} == {
                              "synaptic_tuner/runtime/cli-first-tool-schemas.json",
                              "synaptic_tuner/runtime/Tools/tool_schemas.json"}
                  assert not any(name.startswith("SynthChat/config/targets_")
                                 for name in archive.namelist())
          PY

      - name: Verify declared pytest range and excluded provider SDK
        run: |
          python - <<'PY'
          import importlib.util
          import pytest
          from packaging.version import Version

          version = Version(pytest.__version__)
          assert Version("8") <= version < Version("9"), version
          assert importlib.util.find_spec("modal") is None
          PY

      - name: Verify wheel resources from a neutral working directory
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv "$RUNNER_TEMP/wheel-import-venv"
          "$RUNNER_TEMP/wheel-import-venv/bin/python" -m pip install "$RUNNER_TEMP"/sdist-wheelhouse/synaptic_tuner-*.whl
          "$RUNNER_TEMP/wheel-import-venv/bin/python" -I -B - <<'PY'
          import importlib.resources
          import importlib.util
          import json

          assert importlib.util.find_spec("modal") is None
          assert importlib.util.find_spec("torch") is None
          resource = importlib.resources.files(
              "tuner.execution.providers.modal"
          ).joinpath("modal-runtime-v1.lock.json")
          document = json.loads(resource.read_text(encoding="utf-8"))
          assert document["schema_version"] == "synaptic-modal-runtime-lock/v1"
          worker = importlib.resources.files("tuner.runtime").joinpath(
              "manifests/offline-sft-worker-v1.json"
          )
          worker_document = json.loads(worker.read_text(encoding="utf-8"))
          assert worker_document["schema_version"] == "synaptic-offline-sft-worker-closure/v1"
          import tuner.execution.providers.modal.coordinator_adapter
          import tuner.execution.providers.modal.coordinator_binding
          import tuner.execution.providers.modal.coordinator_effects
          import tuner.execution.providers.modal.coordinator_reader
          import tuner.execution.providers.modal.coordinator_staging
          import tuner.execution.providers.modal.coordinator_launch
          import tuner.execution.providers.modal.coordinator_wire
          import tuner.execution.providers.modal.coordinator_bundle
          import tuner.execution.providers.modal.coordinator_dispatch
          import tuner.execution.providers.modal.coordinator_submit_preparation
          import tuner.execution.providers.modal.coordinator_worker
          import tuner.execution.providers.modal.coordinator_producer
          import tuner.execution.providers.modal.coordinator_logs
          import tuner.execution.providers.modal.coordinator_preflight
          import tuner.execution.providers.modal.coordinator_factories
          import tuner.execution.providers.modal.coordinator_read_transport
          import tuner.execution.providers.modal.coordinator_transport
          import tuner.execution.providers.modal.coordinator_deployment
          import tuner.execution.providers.modal.coordinator_retention
          import tuner.execution.providers.modal.coordinator_composition
          import tuner.execution.providers.modal.worker_ports
          import tuner.execution.providers.modal.worker_source
          import tuner.training.coordinator_material
          import tuner.training.coordinator_service
          import tuner.training.contracts
          import tuner.inference.owned_process
          import tuner.inference.vllm_runtime
          import tuner.inference.chat_session
          import Evaluator.verified_vllm_chat
          import Evaluator.local_run_chat
          import Evaluator.schema_validator
          import shared.validation.dataset_validator
          import tuner.inference.retrieved_model
          import tuner.inference.serving_target
          import tuner.inference.run_chat
          import tuner.execution.providers.modal.inference_model
          import tuner.execution.providers.modal.inference_binding
          import tuner.execution.providers.modal.inference_workload
          import tuner.execution.providers.modal.inference_artifacts
          import tuner.execution.providers.modal.inference_preparation
          import tuner.execution.providers.modal.inference_commands
          import tuner.execution.providers.modal.inference_retention
          import tuner.execution.providers.modal.inference_effects
          import tuner.execution.providers.modal.inference_launch
          import tuner.execution.providers.modal.inference_wire
          import tuner.execution.providers.modal.inference_worker
          import tuner.execution.providers.modal.inference_runtime
          import tuner.execution.providers.modal.inference_bootstrap
          import tuner.execution.providers.modal.inference_channel
          import tuner.execution.providers.modal.inference_channel_client
          import tuner.execution.providers.modal.inference_entrypoint
          import tuner.execution.providers.modal.inference_transport
          import tuner.execution.providers.modal.inference_run_chat
          import tempfile
          import subprocess
          import sys
          from pathlib import Path
          from tuner.project.manifest import load_project_manifest
          from tuner.capabilities.registry import builtin_registry

          assert builtin_registry().list()
          import Evaluator
          import SynthChat
          from Evaluator.config_loader import ConfigLoader as EvaluationConfigLoader
          from SynthChat.generator import ScenarioLoader
          from SynthChat.config.config_loader import ConfigLoader as ScopeConfigLoader
          from shared.environments import EnvironmentValidator

          evaluation = EvaluationConfigLoader(Path(Evaluator.__file__).parent / "config")
          assert evaluation.tool_schema
          assert evaluation.load_all_scenarios(evaluation.load_eval_run().scenarios)
          assert ScenarioLoader(Path(SynthChat.__file__).parent / "scenarios").list_scenarios()
          assert ScopeConfigLoader().load().scopes
          environment = EnvironmentValidator()
          assert environment.tool_schema and environment.execution_config["verb_rules"]
          catalogs = importlib.resources.files("synaptic_tuner").joinpath("runtime")
          assert json.loads(catalogs.joinpath("cli-first-tool-schemas.json").read_text())
          assert json.loads(catalogs.joinpath("Tools/tool_schemas.json").read_text())
          from shared.environments.tool_executor import cli_command_catalog
          from shared.validation.parsing.cli_commands import load_cli_command_catalog
          from shared.validation.dataset_validator import load_tool_schemas
          from SynthChat.scripts.embed_tool_schemas import load_tool_schemas as load_embed_catalog
          with importlib.resources.as_file(catalogs.joinpath("cli-first-tool-schemas.json")) as path:
              assert cli_command_catalog() == load_cli_command_catalog(path)
          assert cli_command_catalog()
          assert load_tool_schemas() == json.loads(catalogs.joinpath("Tools/tool_schemas.json").read_text())
          assert load_embed_catalog() == json.loads(catalogs.joinpath("cli-first-tool-schemas.json").read_text())

          # Spawn first; prohibit process/network effects inside the fresh child.
          import textwrap
          child = textwrap.dedent("""
              import importlib.util, runpy, socket, subprocess, sys
              for name in ("pandas", "numpy", "torch", "sklearn"):
                  assert importlib.util.find_spec(name) is None, name
              def forbidden(*args, **kwargs):
                  raise AssertionError("installed help attempted process or network effects")
              subprocess.Popen = forbidden
              socket.socket.connect = forbidden
              socket.create_connection = forbidden
              from synaptic_tuner.api.v1 import EvaluationAPI, TrainingAPI
              sys.argv = ["Evaluator.cli", "--help"]
              try:
                  runpy.run_module("Evaluator.cli", run_name="__main__")
              except SystemExit as error:
                  assert error.code == 0
              else:
                  raise AssertionError("help did not exit")
              assert "shared.ui" not in sys.modules
              assert not any(name in sys.modules for name in ("pandas", "numpy", "torch", "sklearn"))
          """)
          help_result = subprocess.run([sys.executable, "-I", "-B", "-c", child],
              check=True, capture_output=True, text=True, timeout=30)
          assert "usage:" in help_result.stdout
          with tempfile.TemporaryDirectory() as directory:
              manifest = Path(directory) / "synaptic.yaml"
              manifest.write_text(
                  "schema_version: synaptic-project/v1\n"
                  "project: {id: wheel-consumer, name: Wheel consumer}\n"
                  "engine: {requires: '>=1', api: v1}\n",
                  encoding="utf-8",
              )
              assert load_project_manifest(manifest).project_id == "wheel-consumer"
              cli = Path(sys.executable).parent / "synaptic"
              result = subprocess.run(
                  [str(cli), "--project-root", directory, "capabilities", "list", "--json"],
                  cwd=directory, check=True, capture_output=True, text=True,
              )
              assert json.loads(result.stdout)["success"] is True
          from shared.environments.bounded_local_runtime import FilesystemLimits
          from shared.environments.fixture_parser import EnvironmentFixture
          from shared.environments.local_worker import WorkerEnvironmentRuntime
          with tempfile.TemporaryDirectory() as directory:
              private = Path(directory) / "fixtures"
              private.mkdir(mode=0o700)
              runtime = WorkerEnvironmentRuntime(
                  private, FilesystemLimits(8, 4096, 4096, 4096, 4, 128, 10),
              )
              try:
                  runtime.setup(EnvironmentFixture(["nested"], {"nested/input.txt": "installed fixture"}))
                  runtime.write_text("nested/output.txt", "fixed child response")
                  assert runtime.read_text("nested/input.txt") == "installed fixture"
                  assert runtime.read_text("nested/output.txt") == "fixed child response"
                  snapshot = runtime.snapshot()
                  assert snapshot["runtime"] == "bounded_local" and not snapshot["truncated"]
                  assert "root" not in snapshot
                  assert {item["path"] for item in snapshot["files"]} == {
                      "nested/input.txt", "nested/output.txt",
                  }
                  process = runtime._process
              finally:
                  runtime.teardown()
              assert process.returncode is not None and process.poll() is not None
              assert not list(private.iterdir())
          PY

      - name: Exercise installed environment and durable lifecycle workflows
        if: matrix.suite == 'core'
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/wheel-import-venv/bin/python" -m pip install 'pytest>=8,<9'
          "$RUNNER_TEMP/wheel-import-venv/bin/python" -I -B - <<'PY'
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import sys
          import SynthChat
          import synaptic_tuner.api.v1.reference.data as data
          import synaptic_tuner.api.v1.reference.environment_sessions as sessions
          import synaptic_tuner.api.v1.reference.sqlite_store as sqlite_store
          import synaptic_tuner.api.v1.reference.repositories as repositories
          import shared.environments.local_worker as worker
          import shared.environments.bounded_local_runtime as bounded_runtime

          checkout = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          for module in (SynthChat, data, sessions, worker, bounded_runtime, sqlite_store, repositories):
              location = Path(module.__file__).resolve()
              assert not location.is_relative_to(checkout), location
              assert location.is_relative_to(Path(sys.prefix)), location
          root = Path(os.environ["RUNNER_TEMP"]) / "installed-environment-tests"
          tests = root / "tests" / "contract"
          tests.mkdir(parents=True)
          for name in ("test_environment_sessions_v1.py", "test_environment_admission_v1.py",
                       "test_reference_data_v1.py", "test_dataset_validation_bounds_v1.py",
                       "test_atomic_lifecycle_v1.py",
                       "test_reference_evaluation_v1.py", "test_reference_pipelines_v1.py",
                       "test_sqlite_store_v1.py", "test_atomic_workflow_store_v1.py",
                       "test_sqlite_workflow_host_v1.py", "test_reference_composition_v1.py"):
              shutil.copy2(checkout / "tests" / "contract" / name, tests / name)
          environments = root / "tests" / "environments"
          environments.mkdir()
          for name in ("test_local_worker.py", "test_bounded_local_runtime.py"):
              shutil.copy2(checkout / "tests" / "environments" / name, environments / name)
          for name in ("config", "rubrics"):
              shutil.copytree(Path(SynthChat.__file__).parent / name, root / "SynthChat" / name,
                              ignore=shutil.ignore_patterns("*.py", "__pycache__"))
          subprocess.run([sys.executable, "-I", "-B", "-m", "pytest", "-q", "-p", "no:cacheprovider",
                          str(tests / "test_environment_sessions_v1.py"),
                          str(tests / "test_reference_data_v1.py"),
                          str(tests / "test_dataset_validation_bounds_v1.py"),
                          str(tests / "test_atomic_lifecycle_v1.py"),
                          str(tests / "test_sqlite_store_v1.py"),
                          str(tests / "test_atomic_workflow_store_v1.py"),
                          str(tests / "test_sqlite_workflow_host_v1.py"),
                          str(environments / "test_local_worker.py"),
                          str(environments / "test_bounded_local_runtime.py")], cwd=root, check=True)
          PY

      - name: Exercise installed Modal durable host composition
        if: matrix.suite == 'core'
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/wheel-import-venv/bin/python" -I -B - <<'PYCODE'
          import os
          from pathlib import Path
          import shutil
          import sys
          import tuner.training.modal_host_composition as composition
          import tuner.training.modal_host_storage as storage
          import synaptic_tuner.api.v1.reference.sqlite_store as sqlite_store

          checkout = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          for module in (composition, storage, sqlite_store):
              location = Path(module.__file__).resolve()
              assert not location.is_relative_to(checkout), location
              assert location.is_relative_to(Path(sys.prefix)), location
          root = Path(os.environ["RUNNER_TEMP"]) / "installed-modal-host-tests"
          helpers = (
              "execution/fakes.py", "execution/test_mutation_broker.py",
              "execution/providers/test_modal_packaged_binding.py",
              "execution/providers/test_modal_packaged_composition.py",
              "execution/providers/test_modal_packaged_deployment.py",
              "execution/providers/test_modal_packaged_dispatch.py",
              "execution/providers/test_modal_sdk154_adapter.py",
              "execution/providers/test_modal_source_resolution.py",
              "runtime/test_packaged_runtime_releases.py",
              "training/test_modal_post_training_compilation.py",
              "training/test_packaged_execution_material.py",
              "training/test_training_compiler.py",
              "training/test_modal_host_store_ports.py",
              "training/test_modal_durable_host_composition.py",
          )
          for name in helpers:
              target = root / "tests" / name
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(checkout / "tests" / name, target)
              for parent in target.parents:
                  if parent == root:
                      break
                  (parent / "__init__.py").touch()
          # Only test fixtures are copied. Engine code and assets stay installed.
          import pytest
          sys.path.insert(0, str(root))
          os.chdir(root)
          raise SystemExit(pytest.main([
              "-q", "-p", "no:cacheprovider",
              str(root / "tests/training/test_modal_host_store_ports.py"),
              str(root / "tests/training/test_modal_durable_host_composition.py"),
          ]))
          PYCODE

      - name: Exercise installed standalone Modal retention and known-call reads
        if: matrix.suite == 'core'
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/wheel-import-venv/bin/python" -I -B - <<'PYCODE'
          import os
          from pathlib import Path
          import shutil
          import sys
          import tuner.training.modal_run_retention as retention
          import tuner.training.modal_standalone_runner as runner
          import tuner.training.modal_retained_reader as retained_reader
          import tuner.handlers.runs_handler as runs_handler
          import synaptic_tuner.api.v1.reference.sqlite_store as sqlite_store
          import tuner.training.modal_recipe as recipe
          import tuner.training.modal_host_prepared_copy as prepared_copy
          import tuner.training.grpo_preparation as grpo_preparation
          import tuner.execution.providers.modal.runtime_build as runtime_build
          import tuner.training.modal_local_preparation as local_preparation

          checkout = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          for module in (retention, runner, sqlite_store, retained_reader, runs_handler, recipe, prepared_copy, grpo_preparation, runtime_build, local_preparation):
              location = Path(module.__file__).resolve()
              assert not location.is_relative_to(checkout), location
              assert location.is_relative_to(Path(sys.prefix)), location
          root = Path(os.environ["RUNNER_TEMP"]) / "installed-modal-retention-tests"
          for name in (
