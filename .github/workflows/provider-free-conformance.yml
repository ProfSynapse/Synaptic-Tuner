          for module in (basis, comparison, runner, validator, reference, facade, factory):
              location = Path(module.__file__).resolve()
              assert not location.is_relative_to(checkout), location
              assert location.is_relative_to(Path(sys.prefix)), location
          installed = Path(synaptic_tuner.__file__).resolve().parent.parent
          assert installed.is_relative_to(Path(sys.prefix)), installed
          root = Path(os.environ["RUNNER_TEMP"]) / "installed-evaluation-comparison-tests"
          names = (
              "contract/test_public_evaluation_api_v1.py",
              "contract/test_local_evaluation_http_bounds.py",
              "contract/test_reference_evaluation_v1.py",
              "contract/test_reference_spend_v1.py",
              "evaluator/test_compare.py",
              "evaluator/test_comparison_basis.py",
              "cloud/test_schema_validator.py",
          )
          for name in (*names, "contract/test_reference_data_v1.py"):
              target = root / "tests" / name
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(checkout / "tests" / name, target)
          schemas = root / "schemas"
          schemas.mkdir()
          for name in ("synaptic-evaluation-plan-v1.schema.json", "synaptic-evaluation-result-v1.schema.json"):
              shutil.copy2(installed / "schemas" / name, schemas / name)
          for name in ("config", "rubrics"):
              source = Path(SynthChat.__file__).resolve().parent / name
              assert source.is_relative_to(Path(sys.prefix)), source
              shutil.copytree(source, root / "SynthChat" / name,
                              ignore=shutil.ignore_patterns("*.py", "__pycache__"))
          # Copy only tests and installed non-Python fixtures. No checkout production code.
          import pytest
          sys.path.insert(0, str(root))
          os.chdir(root)
          raise SystemExit(pytest.main(["-q", "-p", "no:cacheprovider",
              *(str(root / "tests" / name) for name in names)]))
          PYCODE

      - name: Exercise installed ordinary HF Jobs host with pinned SDK
        if: matrix.suite == 'core'
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv "$RUNNER_TEMP/hf-host-venv"
          "$RUNNER_TEMP/hf-host-venv/bin/python" -m pip install --require-hashes -r "$GITHUB_WORKSPACE/tuner/execution/providers/hf_jobs_provider_v1/host-dependencies.lock"
          "$RUNNER_TEMP/hf-host-venv/bin/python" -m pip install "$RUNNER_TEMP"/sdist-wheelhouse/synaptic_tuner-*.whl pytest==8.4.2
          "$RUNNER_TEMP/hf-host-venv/bin/python" -I -B - <<'PYCODE'
          import importlib
          import os
          from pathlib import Path
          import shutil
          import sys
          import huggingface_hub
          assert huggingface_hub.__version__ == "1.33.0"
          checkout = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          for name in ("model", "preparation", "transport", "bootstrap", "source_worker", "reader", "composition"):
              module = importlib.import_module("tuner.execution.providers.hf_jobs_provider_v1." + name)
              location = Path(module.__file__).resolve()
              assert not location.is_relative_to(checkout), location
              assert location.is_relative_to(Path(sys.prefix)), location
          root = Path(os.environ["RUNNER_TEMP"]) / "installed-hf-host-tests"
          schema_root = root / "schemas"
          schema_root.mkdir(parents=True)
          installed = Path(importlib.import_module("tuner").__file__).resolve().parent.parent
          for name in ("synaptic-sft-workload-v1.schema.json", "synaptic-execution-source-v1.schema.json"):
              shutil.copy2(installed / "schemas" / name, schema_root / name)
          for name in (
              "execution/providers/test_hf_jobs_public_family.py",
              "training/test_sft_compilation.py",
              "runtime/test_artifact_verification.py",
          ):
              target = root / "tests" / name
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(checkout / "tests" / name, target)
              for parent in target.parents:
                  if parent == root:
                      break
                  (parent / "__init__.py").touch()
          import pytest
          sys.path.insert(0, str(root))
          os.chdir(root)
          raise SystemExit(pytest.main(["-q", "-p", "no:cacheprovider",
              str(root / "tests/execution/providers/test_hf_jobs_public_family.py")]))
          PYCODE

      - name: Exercise installed model preparation with the candidate image Hub SDK
        if: matrix.suite == 'core'
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv "$RUNNER_TEMP/hf-model-venv"
          "$RUNNER_TEMP/hf-model-venv/bin/python" -m pip install --require-hashes -r "$GITHUB_WORKSPACE/tuner/execution/providers/hf_jobs_provider_v1/model-dependencies.lock"
          "$RUNNER_TEMP/hf-model-venv/bin/python" -m pip install "$RUNNER_TEMP"/sdist-wheelhouse/synaptic_tuner-*.whl pytest==8.4.2
          "$RUNNER_TEMP/hf-model-venv/bin/python" -I -B - <<'PYCODE'
          import os
          from pathlib import Path
          import shutil
          import sys
          import huggingface_hub
          import tuner.execution.providers.modal.model_snapshot as model_snapshot
          assert huggingface_hub.__version__ == "1.32.0"
          checkout = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          location = Path(model_snapshot.__file__).resolve()
          assert not location.is_relative_to(checkout), location
          assert location.is_relative_to(Path(sys.prefix)), location
          root = Path(os.environ["RUNNER_TEMP"]) / "installed-hf-model-tests"
          root.mkdir()
          target = root / "test_hf_pinned_model_snapshot.py"
          shutil.copy2(checkout / "tests/execution/providers" / target.name, target)
          import pytest
          os.chdir(root)
          raise SystemExit(pytest.main(["-q", "-p", "no:cacheprovider", str(target)]))
          PYCODE

      - name: Check source hashes and the token-profile example pin without refreshing the runtime lock
        run: |
          python -B scripts/regenerate_hf_parent_closure.py
          python -B scripts/regenerate_offline_sft_worker_closure.py
          python -B scripts/regenerate_modal_runtime_lock.py

      - name: Run provider-free conformance contracts
        env:
          CONFORMANCE_SUITE: ${{ matrix.suite }}
          HF_TOKEN: ""
          HF_API_KEY: ""
          MODAL_TOKEN_ID: ""
          MODAL_TOKEN_SECRET: ""
          WANDB_API_KEY: ""
        run: |
          inference_tests=(tests/execution/providers/test_modal_inference_*.py)
          other_modal_tests=()
          for test_file in tests/execution/providers/test_modal_*.py; do
            if [[ "$test_file" != tests/execution/providers/test_modal_inference_*.py ]]; then
              other_modal_tests+=("$test_file")
            fi
          done
          if [[ ! -f "${inference_tests[0]}" || ${#other_modal_tests[@]} -eq 0 ]]; then
            echo "Modal provider test selection is empty" >&2
            exit 1
          fi
          if [[ "$CONFORMANCE_SUITE" == "modal-inference-a-l" || "$CONFORMANCE_SUITE" == "modal-inference-m-z" ]]; then
            bash scripts/ci_pytest_shard.sh "$CONFORMANCE_SUITE"
            exit
          fi
          if [[ "$CONFORMANCE_SUITE" != "core" ]]; then
            echo "Unknown conformance suite" >&2
            exit 1
          fi
          python -B -m pytest -q -p no:cacheprovider \
            tests/contract/test_provider_neutral_foundation_v1.py \
            tests/contract/test_modal_optional_dependency.py \
            tests/contract/test_modal_runtime_lock.py \
            tests/contract/test_modal_runtime_lock_regeneration.py \
            tests/contract/test_modal_bootstrap_closure.py \
            tests/contract/test_offline_sft_worker_closure.py \
            tests/contract/test_public_runs_api_v1.py \
            tests/contract/test_public_training_api_v1.py \
            tests/contract/test_public_publication_v1.py \
            tests/execution/coordinator_v1 \
            tests/execution/foundation_v2 \
            tests/execution/test_fake_provider_v1_conformance.py \
            tests/execution/test_mutation_broker.py \
            tests/training \
            tests/runtime \
            tests/evaluator/test_owned_process.py \
            tests/evaluator/test_vllm_runtime.py \
            tests/evaluator/test_vllm_interpreter.py \
            tests/evaluator/test_vllm_startup_cleanup.py \
            tests/evaluator/test_chat_session.py \
            tests/evaluator/test_verified_vllm_chat.py \
            tests/evaluator/test_local_run_chat.py \
            tests/evaluator/test_run_chat_local_integration.py \
            tests/evaluator/test_http_transport_policy.py \
            tests/evaluator/test_http_request_bounds.py \
            tests/test_evaluator_clients.py \
            tests/cloud/test_vllm_setup.py \
            tests/inference \
            tests/trainers/sft/test_runtime_v1.py \
            tests/execution/providers/docker_provider_v1 \
            "${other_modal_tests[@]}"

  modal-diagnostics:
    name: Modal 1.5.4 diagnostic contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      MODAL_IS_REMOTE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      HF_TOKEN: ""
      HF_API_KEY: ""
      MODAL_TOKEN_ID: ""
      MODAL_TOKEN_SECRET: ""
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Set up supported Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pinned Modal diagnostic environment
        run: |
          python -m pip install \
            'pytest>=8,<9' \
            'numpy>=1.24,<3' \
            'pandas>=2,<3' \
            'setuptools>=68' \
            'requests>=2.32,<3' \
            'modal==1.5.4' \
            'protobuf==6.33.6' \
            wheel
          python -m pip wheel --no-deps --no-build-isolation \
            --wheel-dir "$RUNNER_TEMP/wheelhouse" .
          python -m pip install "$RUNNER_TEMP"/wheelhouse/synaptic_tuner-*.whl

      - name: Require the pinned Modal protobuf SDK
        run: |
          python - <<'PY'
          from importlib.metadata import version
          import modal_proto.api_pb2

          assert version("modal") == "1.5.4"
          assert version("protobuf") == "6.33.6"
          PY

      - name: Run packaged-call and progress contracts with the pinned SDK
        run: python -B -m pytest -q -p no:cacheprovider tests/training/test_inspect_modal_packaged_call.py tests/execution/providers/test_modal_sdk_progress_handle.py tests/execution/providers/test_modal_sdk_cancel_handle.py

  conformance-gate:
    name: CPython 3.12 / pytest 8
    needs: [conformance, modal-diagnostics]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Require conformance and Modal diagnostic jobs
        env:
          CONFORMANCE_RESULT: ${{ needs.conformance.result }}
          MODAL_DIAGNOSTICS_RESULT: ${{ needs['modal-diagnostics'].result }}
        run: |
          test "$CONFORMANCE_RESULT" = success
          test "$MODAL_DIAGNOSTICS_RESULT" = success

  evaluator-callers:
    name: CPU-only evaluator caller regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      MODAL_IS_REMOTE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      CUDA_VISIBLE_DEVICES: ""
      HF_TOKEN: ""
      HF_API_KEY: ""
      MODAL_TOKEN_ID: ""
      MODAL_TOKEN_SECRET: ""
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Set up supported Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install CPU evaluator test dependencies
        run: |
          python -m pip install 'torch>=2,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'pytest>=8,<9' 'requests>=2.32,<3' 'numpy>=1.24,<3' 'pandas>=2,<3' tqdm .
      - name: Run real caller bodies with fake external effects
        run: |
          python -B -m pytest -q -p no:cacheprovider \
            tests/evaluator/test_same_job_post_training_eval.py \
            tests/evaluator/test_vllm_callers.py \
            tests/cloud/test_cloud_hf_job_vllm.py \
            tests/cloud/test_schema_validator.py \
            tests/cloud/test_vllm_setup.py \
            tests/evaluator/test_vllm_runtime.py \
            tests/evaluator/test_vllm_startup_cleanup.py \
            tests/evaluator/test_owned_process.py
