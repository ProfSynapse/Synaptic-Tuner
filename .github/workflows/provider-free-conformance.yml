name: Provider-free coordinator conformance

on:
  pull_request:
    paths:
      - "synaptic_tuner/api/v1/**"
      - "tuner/execution/coordinator_v1/**"
      - "tuner/execution/foundation_v2/**"
      - "tuner/execution/fake_provider_v1.py"
      - "tuner/execution/providers/modal/**"
      - "tuner/training/**"
      - "tuner/project/**"
      - "tuner/runtime/**"
      - "Evaluator/owned_process.py"
      - "tests/evaluator/test_owned_process.py"
      - "tests/contract/test_modal_optional_dependency.py"
      - "tests/contract/test_modal_runtime_lock*.py"
      - "tests/contract/test_modal_bootstrap_closure.py"
      - "tests/contract/test_offline_sft_worker_closure.py"
      - "tests/contract/fixtures/api_v1_formal_exports_coordinator.json"
      - "tests/contract/test_public_runs_api_v1.py"
      - "tests/contract/test_public_training_api_v1.py"
      - "tests/contract/test_public_publication_v1.py"
      - "tests/contract/test_provider_neutral_foundation_v1.py"
      - "tests/conftest.py"
      - "tests/training/**"
      - "tests/runtime/**"
      - "tests/trainers/sft/test_runtime_v1.py"
      - "tests/execution/providers/docker_provider_v1/**"
      - "tuner/execution/providers/docker_provider_v1/**"
      - "tests/execution/coordinator_v1/**"
      - "tests/execution/foundation_v2/**"
      - "tests/execution/providers/test_modal_*.py"
      - "tests/execution/providers/modal_coordinator_fixtures.py"
      - "tests/execution/test_mutation_broker.py"
      - "tuner/execution/broker.py"
      - "tests/execution/test_fake_provider_v1_conformance.py"
      - "examples/host-project/providers/modal-a10-v1.yaml"
      - "requirements/modal-launcher-v1.lock"
      - "tuner/runtime/manifests/offline-sft-worker-v1.json"
      - "Trainers/sft/**"
      - "Trainers/shared/**"
      - "shared/**"
      - "tuner/cloud/**"
      - "tuner/execution/*.py"
      - "tuner/__init__.py"
      - "synaptic_tuner/__init__.py"
      - "synaptic_tuner/_version.py"
      - "synaptic_tuner/api/__init__.py"
      - "schemas/**"
      - "scripts/regenerate_modal_runtime_lock.py"
      - "scripts/regenerate_offline_sft_worker_closure.py"
      - ".gitattributes"
      - "pyproject.toml"
      - ".github/workflows/provider-free-conformance.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provider-free-conformance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: CPython 3.12 / pytest 8
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      MODAL_IS_REMOTE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Set up supported Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the minimal conformance environment
        run: |
          python -m pip install \
            'pytest>=8,<9' \
            'numpy>=1.24,<3' \
            'pandas>=2,<3' \
            'setuptools>=68' \
            wheel
          python -m pip wheel --no-deps --no-build-isolation \
            --wheel-dir "$RUNNER_TEMP/wheelhouse" .
          python -m pip install "$RUNNER_TEMP"/wheelhouse/synaptic_tuner-*.whl

      - name: Verify declared pytest range and excluded provider SDK
        run: |
          python - <<'PY'
          import importlib.util
          import pytest
          from packaging.version import Version

          version = Version(pytest.__version__)
          assert Version("8") <= version < Version("9"), version
          assert importlib.util.find_spec("modal") is None
          PY

      - name: Verify wheel resources from a neutral working directory
        working-directory: ${{ runner.temp }}
        run: |
          python -B - <<'PY'
          import importlib.resources
          import json

          resource = importlib.resources.files(
              "tuner.execution.providers.modal"
          ).joinpath("modal-runtime-v1.lock.json")
          document = json.loads(resource.read_text(encoding="utf-8"))
          assert document["schema_version"] == "synaptic-modal-runtime-lock/v1"
          worker = importlib.resources.files("tuner.runtime").joinpath(
              "manifests/offline-sft-worker-v1.json"
          )
          worker_document = json.loads(worker.read_text(encoding="utf-8"))
          assert worker_document["schema_version"] == "synaptic-offline-sft-worker-closure/v1"
          import tuner.execution.providers.modal.coordinator_adapter
          import tuner.execution.providers.modal.coordinator_binding
          import tuner.execution.providers.modal.coordinator_effects
          import tuner.execution.providers.modal.coordinator_reader
          import tuner.execution.providers.modal.coordinator_staging
          import tuner.execution.providers.modal.coordinator_launch
          import tuner.execution.providers.modal.coordinator_wire
          import tuner.execution.providers.modal.coordinator_bundle
          import tuner.execution.providers.modal.coordinator_dispatch
          import tuner.execution.providers.modal.coordinator_submit_preparation
          import tuner.execution.providers.modal.coordinator_worker
          import tuner.execution.providers.modal.coordinator_producer
          import tuner.execution.providers.modal.coordinator_logs
          import tuner.execution.providers.modal.coordinator_preflight
          import tuner.execution.providers.modal.coordinator_factories
          import tuner.execution.providers.modal.coordinator_read_transport
          import tuner.execution.providers.modal.coordinator_transport
          import tuner.execution.providers.modal.coordinator_deployment
          import tuner.execution.providers.modal.coordinator_retention
          import tuner.execution.providers.modal.coordinator_composition
          import tuner.execution.providers.modal.worker_ports
          import tuner.execution.providers.modal.worker_source
          import tuner.training.coordinator_material
          import tuner.training.coordinator_service
          import tuner.training.contracts
          import Evaluator.owned_process
          PY

      - name: Check source hashes without refreshing the runtime lock
        run: |
          python -B scripts/regenerate_offline_sft_worker_closure.py
          python -B scripts/regenerate_modal_runtime_lock.py

      - name: Run provider-free conformance contracts
        env:
          HF_TOKEN: ""
          HF_API_KEY: ""
          MODAL_TOKEN_ID: ""
          MODAL_TOKEN_SECRET: ""
          WANDB_API_KEY: ""
        run: |
          python -B -m pytest -q -p no:cacheprovider \
            tests/contract/test_provider_neutral_foundation_v1.py \
            tests/contract/test_modal_optional_dependency.py \
            tests/contract/test_modal_runtime_lock.py \
            tests/contract/test_modal_runtime_lock_regeneration.py \
            tests/contract/test_modal_bootstrap_closure.py \
            tests/contract/test_offline_sft_worker_closure.py \
            tests/contract/test_public_runs_api_v1.py \
            tests/contract/test_public_training_api_v1.py \
            tests/contract/test_public_publication_v1.py \
            tests/execution/coordinator_v1 \
            tests/execution/foundation_v2 \
            tests/execution/test_fake_provider_v1_conformance.py \
            tests/execution/test_mutation_broker.py \
            tests/training \
            tests/runtime \
            tests/evaluator/test_owned_process.py \
            tests/trainers/sft/test_runtime_v1.py \
            tests/execution/providers/docker_provider_v1 \
            tests/execution/providers/test_modal_*.py
