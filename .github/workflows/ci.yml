name: CI

# Repository-wide lint and the full CPU pytest suite. The path-filtered
# provider-free conformance workflow stays separate and unchanged.

on:
  pull_request:
  push:
    branches: [main, feat/submodule-cloud-api-v1, feat/submodule-cloud-api-v1-windows]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Ruff (pyflakes)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .pre-commit-config.yaml

      # Keep in step with the ruff-pre-commit rev in .pre-commit-config.yaml.
      - name: Install ruff
        run: python -m pip install 'ruff==0.16.10'

      - name: Run ruff (rules and excludes from pyproject.toml)
        run: ruff check --output-format=github .

  tests:
    # The whole suite, split into three shards whose union is every test file:
    # the Modal inference provider tests dominate runtime, so they get two
    # shards and everything else runs in "core".
    name: pytest (CPython 3.12, CPU, ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [core, modal-inference-a-l, modal-inference-m-z]
    env:
      CUDA_VISIBLE_DEVICES: ""
      HF_TOKEN: ""
      HF_API_KEY: ""
      MODAL_TOKEN_ID: ""
      MODAL_TOKEN_SECRET: ""
      WANDB_API_KEY: ""
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-ci-tests.txt
            pyproject.toml

      - name: Install CPU test environment
        run: |
          python -m pip install 'torch>=2,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-ci-tests.txt -e .

      - name: Run pytest shard
        env:
          SHARD: ${{ matrix.shard }}
        run: bash scripts/ci_pytest_shard.sh "$SHARD"

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pytest-results-${{ matrix.shard }}
          path: pytest-${{ matrix.shard }}.xml
          if-no-files-found: ignore
          retention-days: 14

  tests-gate:
    name: pytest (all shards)
    needs: [tests]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Require every test shard
        env:
          TESTS_RESULT: ${{ needs.tests.result }}
        run: test "$TESTS_RESULT" = success
